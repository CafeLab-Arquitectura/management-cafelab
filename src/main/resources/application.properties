spring.application.name=management-cafelab

# Carga .env desde la raíz del proyecto (IntelliJ, mvn, etc.)
#spring.config.import=optional:file:.env[.properties]


# PostgreSQL / Supabase (pooler transaccional, puerto 6543 o sesion 5432)
# Reutiliza las mismas credenciales de iam-cafelab y iotmonitoring si no se especifican variables SUPABASE_*
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USERNAME}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool (recomendado con PgBouncer en modo transacción)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.naming.physical-strategy=com.upc.pe.managementcafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Reverse-proxy support
server.forward-headers-strategy=framework

# JWT Configuration Properties
authorization.jwt.secret = ${JWT_SECRET:local-dev-only-change-me-0123456789abcdef0123456789abcdef0123456789abcdef}
authorization.jwt.expiration.days = 7

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka
eureka.instance.instance-id=${WEBSITE_HOSTNAME:localhost}:${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${WEBSITE_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${PORT:8082}

# Flyway Configuration
spring.flyway.enabled=false

# Puerto local por defecto: 8082 (para no colisionar con Gateway 8080 ni IAM 8081)
server.port=${PORT:8082}